# TA-cveicu - Splunk Add-on for CVE List V5
# App configuration file

[install]
is_configured = false
state = enabled
build = 2

[id]
name = TA-cveicu
version = 1.1.1

[package]
id = TA-cveicu
check_for_updates = true

[launcher]
author = cve.icu
description = Ingest and analyze CVE (Common Vulnerabilities and Exposures) records from the official CVE Program repository. Features bulk baseline downloads, hourly delta updates, CVSS scoring, CISA-ADP enrichment, and comprehensive vulnerability dashboards. Compatible with Splunk 9.3+.
version = 1.1.1

[ui]
is_visible = true
label = cve.icu
