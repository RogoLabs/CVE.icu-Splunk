name: CI (v1.x - Splunk 9)

on:
  push:
    branches: [v1.x]
  pull_request:
    branches: [v1.x]

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest
      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/TA-cveicu/bin:${{ github.workspace }}/TA-cveicu/bin/lib
        run: pytest tests/unit/ -v

  appinspect:
    name: AppInspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install AppInspect
        run: pip install splunk-appinspect
      - name: Build package
        run: |
          COPYFILE_DISABLE=1 tar -czf TA-cveicu.tar.gz \
            --exclude='.*' \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='*.pyo' \
            --exclude='local' --exclude='metadata/local.meta' \
            TA-cveicu/
      - name: Run AppInspect
        run: splunk-appinspect inspect TA-cveicu.tar.gz --mode precert
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ta-cveicu-package
          path: TA-cveicu.tar.gz

  docker-integration:
    name: Docker Integration (Splunk ${{ matrix.splunk-version }})
    runs-on: ubuntu-latest
    needs: [unit-tests, appinspect]
    strategy:
      fail-fast: false
      matrix:
        splunk-version: ["9.3", "9.4"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest requests
      - name: Build package
        run: |
          COPYFILE_DISABLE=1 tar -czf TA-cveicu.tar.gz \
            --exclude='.*' \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='*.pyo' \
            --exclude='local' --exclude='metadata/local.meta' \
            TA-cveicu/
      - name: Start Splunk container
        run: |
          docker run -d --name splunk \
            -p 8089:8089 -p 8000:8000 \
            -e SPLUNK_START_ARGS=--accept-license \
            -e SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com \
            -e SPLUNK_PASSWORD=TestPassword123! \
            -e SPLUNK_APPS_URL=/tmp/TA-cveicu.tar.gz \
            -v "$(pwd)/TA-cveicu.tar.gz:/tmp/TA-cveicu.tar.gz:ro" \
            splunk/splunk:${{ matrix.splunk-version }}
          echo "Waiting for Splunk to be healthy..."
          for i in $(seq 1 60); do
            if curl -sf -k -u admin:TestPassword123! \
              https://localhost:8089/services/server/info > /dev/null 2>&1; then
              echo "Splunk is ready after $((i * 10))s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "ERROR: Splunk did not start"
              docker logs splunk 2>&1 | tail -30
              exit 1
            fi
            sleep 10
          done
      - name: Restart Splunk to register modular inputs and icons
        run: |
          curl -sk -u admin:TestPassword123! \
            -X POST https://localhost:8089/services/server/control/restart > /dev/null
          echo "Restart issued, waiting..."
          sleep 30
          for i in $(seq 1 30); do
            if curl -sf -k -u admin:TestPassword123! \
              https://localhost:8089/services/apps/local/TA-cveicu?output_mode=json 2>/dev/null | \
              python3 -c "import sys,json; d=json.load(sys.stdin); assert d['entry'][0]['content']['version']" 2>/dev/null; then
              echo "Splunk restarted and app verified"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "ERROR: Splunk did not restart properly"
              docker logs splunk 2>&1 | tail -30
              exit 1
            fi
            sleep 10
          done
      - name: Run integration tests
        env:
          SPLUNK_URL: https://localhost:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: TestPassword123!
        run: pytest tests/integration/ -v -m "not live"
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== splunkd.log ==="
          docker exec splunk bash -c 'grep -i "cveicu\|modular.*input\|scheme\|ExecProcessor\|ERROR" /opt/splunk/var/log/splunk/splunkd.log | tail -50' 2>&1 || true
          echo "=== installed apps ==="
          curl -sk -u admin:TestPassword123! 'https://localhost:8089/services/apps/local?output_mode=json' | python3 -c "import sys,json; [print(a['name']) for a in json.load(sys.stdin).get('entry',[])]" 2>&1 || true
      - name: Cleanup
        if: always()
        run: docker rm -f splunk || true
