name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest
      - name: Run unit tests
        run: pytest tests/unit/ -v

  appinspect:
    name: AppInspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AppInspect
        run: pip install splunk-appinspect
      - name: Build package
        run: |
          COPYFILE_DISABLE=1 tar -czf TA-cveicu.tar.gz \
            --exclude='__pycache__' --exclude='*.pyc' TA-cveicu/
      - name: Run AppInspect
        run: splunk-appinspect inspect TA-cveicu.tar.gz --mode precert
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ta-cveicu-package
          path: TA-cveicu.tar.gz

  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, appinspect]
    services:
      splunk:
        image: splunk/splunk:10.0
        env:
          SPLUNK_START_ARGS: --accept-license
          SPLUNK_PASSWORD: TestPassword123!
        ports:
          - 8089:8089
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8089/services/server/health/splunkd/details --insecure -u admin:TestPassword123! || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 120s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest requests
      - name: Build and install package
        run: |
          COPYFILE_DISABLE=1 tar -czf TA-cveicu.tar.gz \
            --exclude='__pycache__' --exclude='*.pyc' TA-cveicu/
          curl -k -u admin:TestPassword123! \
            https://localhost:8089/services/apps/local \
            -F name=@TA-cveicu.tar.gz \
            -F filename=true \
            -F update=true
          curl -k -u admin:TestPassword123! \
            -X POST https://localhost:8089/services/server/control/restart
          sleep 60
          for i in $(seq 1 30); do
            if curl -sf -k -u admin:TestPassword123! \
              https://localhost:8089/services/server/info > /dev/null 2>&1; then
              echo "Splunk is ready"
              break
            fi
            echo "Waiting for Splunk... ($i/30)"
            sleep 10
          done
      - name: Run integration tests
        env:
          SPLUNK_URL: https://localhost:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: TestPassword123!
        run: pytest tests/integration/ -v -m "not live"
